version: '3.8'

services:
  # 1. Container PHP-FPM (Laravel App)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: knowledge-bank-app
    container_name: knowledge_bank_app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www
    command: php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000 --watch
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - db
    networks:
      - knowledge_bank_network

  # 2. Container Nginx (Web Server) -> Port 4008
  web:
    image: nginx:alpine
    container_name: knowledge_bank_web
    restart: unless-stopped
    tty: true
    ports:
      - "4008:80"
    volumes:
      - ./:/var/www
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - knowledge_bank_network

  # 3. Container Database (MySQL) -> Port 4009
  db:
    image: mysql:8.0
    container_name: knowledge_bank_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-knowledge_bank}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "4009:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - knowledge_bank_network

  # 4. Container phpMyAdmin -> Port 4010
  phpmyadmin:
    # phpMyAdmin 5.2.3 / PHP 8.3.36, verified security-patched image.
    image: phpmyadmin:5.2.3-apache@sha256:62a50b1419fe55b9b4c3cd6f5aed03a18f8f5b4a236f24735d76400bea75a5ff
    container_name: knowledge_bank_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "4010:80"
    volumes:
      - ./php/security.ini:/usr/local/etc/php/conf.d/zz-security.ini:ro
    depends_on:
      - db
    networks:
      - knowledge_bank_network

  # 5. Container Redis (Cache & Queue)
  redis:
    image: redis:alpine
    container_name: knowledge_bank_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    networks:
      - knowledge_bank_network

  # 6. Container Queue Worker
  queue_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: knowledge-bank-app
    container_name: knowledge_bank_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --tries=2 --timeout=300
    volumes:
      - ./:/var/www
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - db
    networks:
      - knowledge_bank_network

networks:
  knowledge_bank_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redisdata:
    driver: local
