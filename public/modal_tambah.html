<!DOCTYPE html>

<html class="dark" lang="id"><head>
<meta charset="utf-8"/>

                        "secondary-container": "#00a2e6",
                        "surface-bright": "#2c3951",

                        "primary-fixed": "#e1e0ff",
                        "primary": "#c0c1ff",
                        "primary-container": "#8083ff",
                        "on-error": "#690005",
                        "tertiary-fixed": "#f0dbff",

                        "surface-container-highest": "#27354c",
                        "on-tertiary-container": "#400071",

                        "on-primary-fixed-variant": "#2f2ebe",
                        "on-secondary-fixed": "#001e2f",

                        "secondary": "#89ceff",

                        "error-container": "#93000a",
                        "inverse-surface": "#d6e3ff",
                        "on-surface-variant": "#c7c4d7",
                        "surface-container-lowest": "#010e24",
                        "on-primary": "#1000a9",
                        "background": "#041329",
                        "surface-container-high": "#1c2a41",
                        "secondary-fixed": "#c9e6ff"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",

                    spacing: {

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-modal {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .bg-glow-radial {
            background: radial-gradient(circle at 0% 0%, rgba(137, 206, 255, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, rgba(221, 183, 255, 0.1) 0%, transparent 50%);
        }
        .input-glass {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #d6e3ff;
            transition: all 0.3s ease;
        }
        .input-glass:focus {
            border-color: #89ceff;
            box-shadow: 0 0 0 1px #89ceff, inset 0 0 10px rgba(137, 206, 255, 0.1);
            outline: none;
        }
        .input-glass option {
            background-color: #0d1c32;
            color: #d6e3ff;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen overflow-hidden bg-glow-radial relative">
<!-- Background Context (Assign Account List) -->
<div class="absolute inset-0 flex">
<!-- SideNav Overlay Context -->
<aside class="hidden md:flex flex-col flex-shrink-0 w-72 h-screen bg-surface-container/60 backdrop-blur-xl border-r border-white/10 shadow-xl py-6 justify-between opacity-50 filter blur-sm">
<div class="px-6 flex items-center space-x-3 mb-8">
<span class="material-symbols-outlined text-3xl text-primary" data-icon="school" data-weight="fill" style="font-variation-settings: 'FILL' 1;">school</span>
<div>
<h1 class="font-headline-md text-headline-md font-bold text-primary">ThesisCloud Admin</h1>
</div>
</div>
<!-- Dummy Nav Items for background context -->
<nav class="flex-1 space-y-2 px-4">
<a class="flex items-center space-x-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-white/10 transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-body-md text-body-md">Dashboard Utama</span>
</a>
<a class="flex items-center space-x-3 px-4 py-3 rounded-lg text-primary font-bold border-r-4 border-primary bg-white/5" href="#">
<span class="material-symbols-outlined" data-icon="person_add">person_add</span>
<span class="font-body-md text-body-md">Assign Account</span>
</a>
</nav>
</aside>
<main class="flex-1 flex flex-col h-screen opacity-50 filter blur-sm pointer-events-none">
<!-- TopNavBar Overlay Context -->
<header class="w-full h-20 flex-shrink-0 border-b border-white/10 shadow-sm bg-surface/40 backdrop-blur-md sticky top-0 z-40 flex justify-between items-center px-gutter">
<h2 class="font-headline-md text-headline-md font-bold text-primary">Assign Account</h2>
</header>
<div class="p-container-padding-desktop">
<div class="glass-panel p-8 rounded-xl h-96 w-full flex items-start justify-end">
<button class="bg-primary/20 text-primary border border-primary/50 px-6 py-2 rounded-lg font-body-md flex items-center space-x-2">
<span class="material-symbols-outlined text-sm">add</span>
<span>Tambah Akun</span>
</button>
</div>
</div>
</main>
</div>
<!-- Modal Overlay Backdrop -->
<div class="fixed inset-0 bg-background/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
<!-- Modal Container -->
<div class="glass-modal w-full max-w-lg rounded-2xl p-8 relative flex flex-col gap-6 shadow-[0_0_40px_rgba(192,193,255,0.1)]">
<!-- Close Button -->
<button aria-label="Tutup" class="absolute top-6 right-6 text-on-surface-variant hover:text-white transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<!-- Modal Header -->
<div>
<h2 class="font-headline-md text-headline-md font-bold text-primary mb-2">Tambah Akun Manual</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Masukkan detail pengguna baru ke dalam sistem ThesisCloud.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-5">
<!-- Nama Lengkap -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface" for="nama-lengkap">Nama Lengkap</label>
<input class="input-glass rounded-lg px-4 py-3 font-body-md w-full" id="nama-lengkap" name="nama-lengkap" placeholder="Contoh: Budi Santoso" required="" type="text"/>
</div>
<!-- NIM / NPP -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface" for="nim-npp">NIM / NPP</label>
<input class="input-glass rounded-lg px-4 py-3 font-body-md w-full" id="nim-npp" name="nim-npp" placeholder="Masukkan nomor identitas" required="" type="text"/>
</div>
<!-- Role Selection -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface" for="role">Pilih Role</label>
<div class="relative">
<select class="input-glass rounded-lg px-4 py-3 font-body-md w-full appearance-none pr-10" id="role" name="role" required="">
<option disabled="" hidden="" selected="" value="">Pilih peran pengguna...</option>
<option value="mahasiswa">Mahasiswa</option>
<option value="dosen">Dosen</option>
<option value="admin">Admin</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
<!-- Info Callout -->
<div class="bg-secondary-container/10 border border-secondary/20 rounded-lg p-4 flex items-start space-x-3 mt-2">
<span class="material-symbols-outlined text-secondary mt-0.5" data-icon="info">info</span>
<div>
<p class="font-label-sm text-label-sm text-secondary uppercase tracking-wider mb-1">Informasi Kredensial</p>
<p class="font-body-md text-body-md text-on-surface-variant text-sm">Kata sandi default: <span class="font-mono text-white bg-white/10 px-2 py-0.5 rounded">knowledgebank123</span></p>
</div>
</div>
<!-- Actions -->
<div class="flex justify-end space-x-4 mt-4 pt-4 border-t border-white/10">
<button class="px-6 py-2.5 rounded-lg font-body-md text-body-md font-semibold text-on-surface-variant hover:text-white border border-transparent hover:border-white/20 transition-all" type="button">
                        Batal
                    </button>
<button class="bg-gradient-to-r from-inverse-primary to-tertiary-container text-white px-6 py-2.5 rounded-lg font-body-md text-body-md font-semibold shadow-[0_0_15px_rgba(73,75,214,0.4)] hover:shadow-[0_0_25px_rgba(73,75,214,0.6)] transition-all" type="submit">
                        Simpan
                    </button>
</div>
</form>
</div>
</div>
</body></html>
